<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sheet</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
  font-family: Arial, sans-serif;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  background: white;
  border-radius: 14px;
  box-shadow: 0 4px 20px #0001;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

th {
  background: #222;
  color: white;
  padding: 14px;
  text-align: left;
  white-space: nowrap;
}

td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  vertical-align: middle;
}

tr:hover {
  background: #fafafa;
}

/* fotoğraflar */
td img {
  width: 220px;
  height: 220px;
  object-fit: contain;
  display: block;
  margin: auto;
  border-radius: 10px;
  background: #eee;
}

/* fotoğraf sütunu */
td:has(img) {
  min-width: 240px;
  text-align: center;
}

#loading {
  text-align: center;
  padding: 50px;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="loading">yükleniyor... ♡</div>

<div class="table-wrap">
  <table id="sheet" style="display:none;">
    <thead></thead>
    <tbody></tbody>
  </table>
</div>

<script>
/* BURAYA GOOGLE SHEET'İN CSV LİNKİNİ KOY */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSH7kC5MiOHk8xLOKiDfcz6e7tNV4yXtYtDKw8U9QqpnbJJYKvAzuG_V6l_M6IeHQ-aoh7bY5ey8ZwX/pubhtml";

async function loadSheet() {
  try {
    const response = await fetch(SHEET_URL);
    const text = await response.text();

    const rows = parseCSV(text);

    if (!rows.length) return;

    const headers = rows[0];

    const table = document.getElementById("sheet");
    const thead = table.querySelector("thead");
    const tbody = table.querySelector("tbody");

    /* başlıklar */
    thead.innerHTML = `
      <tr>
        ${headers.map(h => `<th>${escapeHTML(h)}</th>`).join("")}
      </tr>
    `;

    /* satırlar */
    rows.slice(1).forEach(row => {
      const tr = document.createElement("tr");

      headers.forEach((_, i) => {
        const td = document.createElement("td");
        const value = row[i] || "";

        if (isImage(value)) {
          const img = document.createElement("img");
          img.src = value.trim();
          img.loading = "lazy";

          img.onerror = () => {
            td.textContent = value;
          };

          td.appendChild(img);
        } else {
          td.textContent = value;
        }

        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });

    document.getElementById("loading").style.display = "none";
    table.style.display = "table";

  } catch (error) {
    document.getElementById("loading").textContent =
      "sheet yüklenemedi :(";
    console.error(error);
  }
}

/* CSV okuyucu */
function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {
      cell += '"';
      i++;
    }
    else if (char === '"') {
      insideQuotes = !insideQuotes;
    }
    else if (char === "," && !insideQuotes) {
      row.push(cell);
      cell = "";
    }
    else if ((char === "\n" || char === "\r") && !insideQuotes) {
      if (char === "\r" && next === "\n") i++;

      row.push(cell);
      rows.push(row);
      row = [];
      cell = "";
    }
    else {
      cell += char;
    }
  }

  if (cell || row.length) {
    row.push(cell);
    rows.push(row);
  }

  return rows;
}

function isImage(url) {
  return /^https?:\/\/.+\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i.test(url.trim());
}

function escapeHTML(text) {
  return text
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

loadSheet();
</script>

</body>
</html>

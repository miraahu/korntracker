<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korn Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: #ffffff;
    }
    .container {
      width: 100%;
      height: 100vh;
      overflow: auto;
    }
    iframe {
      width: 150%; /* Ekran genişliğini sanal olarak büyütür */
      height: 150vh;
      border: 0;
      transform: scale(0.75); /* Görselleri ve yazıları orantılı ölçeklendirir */
      transform-origin: 0 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSH7kC5MiOHk8xLOKiDfcz6e7tNV4yXtYtDKw8U9QqpnbJJYKvAzuG_V6l_M6IeHQ-aoh7bY5ey8ZwX/pubhtml?widget=true&amp;headers=false"></iframe>
  </div>

</body>
</html>
